name: CI

on:
  push:
    branches:
      - main
  pull_request:
    
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
      - name: Run tests
        run: go test -v ./...

  typos:
    name: Detect typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Run typos
        uses: crate-ci/typos@v1.41.0
